name: Guardrails - Doc Path Alignment

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".agents/skills/**"
      - "scripts/check-doc-paths.ts"
      - "Justfile"
      - ".github/workflows/guardrails-doc-paths.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - ".agents/skills/**"
      - "scripts/check-doc-paths.ts"
      - "Justfile"
      - ".github/workflows/guardrails-doc-paths.yml"

jobs:
  docs-path-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Validate AGENTS/skill path references
        run: bun run scripts/check-doc-paths.ts
