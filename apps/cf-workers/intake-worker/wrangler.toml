name = "intake-worker"
main = "src/index.ts"
compatibility_date = "2026-02-09"
compatibility_flags = ["nodejs_compat_v2"]

send_email = [
  { name = "SEND_EMAIL", destination_address = "chi@desertservices.net" }
]

[observability]
enabled = true

# Email routing: intake@desertservices.app (+ contracts@, dustpermits@) → this worker
# Workers.dev URL: intake-worker.cheez2012.workers.dev
#
# Secrets (set via `wrangler secret put`):
# - HUB_WEBHOOK_URL (https://webhooks.desertservices.app)
