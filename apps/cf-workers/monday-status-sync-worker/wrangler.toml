name = "monday-status-sync"
main = "src/index.ts"
compatibility_date = "2026-01-21"
compatibility_flags = ["nodejs_compat_v2"]

# Cron trigger - runs every hour at :15
[triggers]
crons = ["15 * * * *"]

# Observability
[observability]
enabled = true

# Secrets (set via dashboard or `wrangler secret put`):
# - MONDAY_API_KEY

# Optional vars for Project Link Sync:
# [vars]
# ENABLE_PROJECT_LINK_SYNC = "true"
# PROJECTS_BOARD_ID = "8692330900"
# ESTIMATE_PROJECT_LINK_COL = "board_relation_mktgebxf"
# PROJECT_ESTIMATE_LINK_COL = "board_relation_mktgn7cb"
# LEAD_PROJECT_LINK_COL = "board_relation_xxxxxxxx"
# ESTIMATE_PROJECT_NUMBER_COL = "text_xxxxxxxx"
# LEAD_PROJECT_NUMBER_COL = "text_xxxxxxxx"
# PROJECT_PROJECT_NUMBER_COL = "text_xxxxxxxx"
