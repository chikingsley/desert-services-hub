e="text/javascript" charset="utf-8" src="https://js.arcgis.com/4.24/esri/layers/TileLayer.js"></script><script type="text/javascript" charset="utf-8" src="https://js.arcgis.com/4.24/esri/layers/VectorTileLayer.js"></script><script type="text/javascript" charset="utf-8" src="https://js.arcgis.com/4.24/esri/views/2d/layers/FeatureLayerView2D.js"></script><script type="text/javascript" charset="utf-8" src="https://js.arcgis.com/4.24/esri/views/2d/layers/TileLayerView2D.js"></script><script type="text/javascript" charset="utf-8" src="https://js.arcgis.com/4.24/esri/views/2d/layers/VectorTileLayerView2D.js"></script><script src="https://js.arcgis.com/4.24/"></script>

-widget"><div tabindex="-1" class="esri-search--multiple-sources esri-search__container"><button id="19d323bab12-widget-3-source-menu-button" aria-label="Search in" title="Search in" aria-haspopup="true" aria-expanded="false" aria-controls="19d323bab12-widget-3-source-menu" class="esri-search__sources-button esri-widget--button" data-node-ref="_sourceMenuButtonNode" type="button"><span aria-hidden="true" class="esri-icon-down-arrow esri-search__sources-button--down"></span><span aria-hidden="true" class="esri-icon-up-arrow esri-search__sources-button--up"></span><span class="esri-search__source-name">All</span></button><div class="esri-menu esri-search__sources-menu"><ul aria-labelledby="19d323bab12-widget-3-source-menu-button" id="19d323bab12-widget-3-source-menu" role="menu" data-node-ref="_sourceListNode" class="esri-menu__list" tabindex="-1"><li id="19d323bab12-widget-3-source-item-0" aria-checked="true" role="menuitemradio" class="esri-search__source esri-menu__list-item esri-menu__list-item--active">All</li><li id="19d323bab12-widget-3-source-item-1" aria-checked="false" role="menuitemradio" class="esri-search__source esri-menu__list-item">Address</li><li id="19d323bab12-widget-3-source-item-2" aria-checked="false" role="menuitemradio" class="esri-search__source esri-menu__list-item">Parcel</li></ul></div><div class="esri-search__input-container"><form class="esri-search__form" role="search"><input type="text" aria-autocomplete="list" aria-expanded="false" aria-controls="19d323bab12-widget-3-suggest-menu" aria-haspopup="listbox" aria-label="Search" placeholder="Find address or place" autocomplete="off" class="esri-input esri-search__input" id="19d323bab12-widget-3-input" role="combobox" data-node-ref="_inputNode" title="Find address or place" style=""></form><div id="19d323bab12-widget-3-suggest-menu" class="esri-menu esri-search__suggestions-menu" role="listbox" aria-labelledby="19d323bab12-widget-3-input" data-node-ref="_suggestionListNode"><ul role="group" class="esri-menu__list esri-search__suggestions-list esri-search__suggestions-list--current-location"><li id="19d323bab12-widget-3-suggestion-item-0" aria-selected="false" role="option" class="esri-menu__list-item"><span aria-hidden="true" class="esri-icon-locate-circled"></span> Use current location</li></ul></div></div><button aria-label="Search" class="esri-search__submit-button esri-widget--button" title="Search" type="button"><span aria-hidden="true" class="esri-icon-search"></span></button><div class="esri-menu esri-search__warning-menu"><div class="esri-search__warning-body"><div><span aria-hidden="true" class="esri-icon-notice-triangle"></span><span class="esri-search__no-value-text">Please enter a search term.</span></div></div></div></div></div></div></div></div><div class="esri-view-user-storage"></div></div>

<script>
    require(["esri/config",
        "esri/Map",
        "esri/views/MapView",
        "esri/widgets/Locate",
        "esri/widgets/Search",
        "esri/widgets/Search/SearchViewModel",
        "esri/layers/FeatureLayer",
        "esri/Graphic",
    ], function (esriConfig,
        Map,
        MapView,
        Locate,
        Search,
        SearchViewModel,
        FeatureLayer,
        Graphic
    ) {
        esriConfig.apiKey = "AAPK8b2ce96b69e444f9a0c9b38b358f04b9bivwZBFW4IQqydIo2KdGsN0eXa9JEWxVF1HKv-O8D7CmONh-N7uZbPICvtZIoQtF";
        map = new Map({
            // basemap: "topo-vector"
            basemap: "hybrid"
        });
        //32.13833144604056, -111.38956213541775 //32.17553525857343, -111.00504068324446
        const view = new MapView({
            map: map,
            center: [-111.005040683, 32.175535258], // Longitude, latitude
            zoom: 11,
            container: "map-div",
            popup: {
                dockEnabled: true,
                collapseEnabled: false,
            }
        });


        //GIVEN LINK: https://gisdata.pima.gov/arcgis1/rest/services/GISOpenData/Addresses/MapServer/9/
        //https://services2.arcgis.com/UTBp78iglGpbqp1B/ArcGIS/rest/services/GWiz_Addr/FeatureServer/0

        //New Map Service: https://services2.arcgis.com/UTBp78iglGpbqp1B/ArcGIS/rest/services/GWiZ_Results/FeatureServer/53
        //Newer Map Service: https://services2.arcgis.com/UTBp78iglGpbqp1B/ArcGIS/rest/services/GWiZ_Results/FeatureServer/54
        //
        //old1: "https://services2.arcgis.com/UTBp78iglGpbqp1B/ArcGIS/rest/services/GWiz_Addr/FeatureServer/0",
        //old2:"htts://gisdata.pima.gov/arcgis1/rest/services/GISOpenData/Addresses/MapServer/9",
        //old3: https://services2.arcgis.com/UTBp78iglGpbqp1B/ArcGIS/rest/services/GWiZ_Results/FeatureServer/53
        //6/12/25 NEW LAYER: https://services2.arcgis.com/UTBp78iglGpbqp1B/ArcGIS/rest/services/GWiZ_Results/FeatureServer/54
        //6/23/25 new layer: https://services2.arcgis.com/UTBp78iglGpbqp1B/ArcGIS/rest/services/GWiz_Addr/FeatureServer/0
        // also : https://services2.arcgis.com/UTBp78iglGpbqp1B/ArcGIS/rest/services/GWiz_Addr/FeatureServer/1
        /* LAYER DEFINITIONS */
        const addressLayer = new FeatureLayer({
            title: "Address Layer",
            url: "https://gisdata.pima.gov/arcgis2/rest/services/acportal/MapServer/0",
            outFields: ["*"],
        });
        const addressLayerAPNAttrName = "PARCEL";
        const addressLayerAddressAttrName = "FullAddress";
        // map.add(addressLayer);
        const parcelLayer = new FeatureLayer({
            title: "Parcel Layer",
            url: "https://gisdata.pima.gov/arcgis2/rest/services/acportal/MapServer/1",
            outFields: ["*"],
            minScale: 10000,
            renderer: {
                type: "simple",
                symbol: {
                    type: "simple-line",
                    color: "#424242",
                    size: .4,
                }
            }
        });
        map.add(parcelLayer);
        const parcelLayerAPNAttrName = "PARCEL";

        const jurisdictionLayer = new FeatureLayer({
            url: "https://gisdata.pima.gov/arcgis1/rest/services/GISOpenData/Boundaries/MapServer/11",
            outFields: ["*"],
        });

        // Declare highlight graphics holders at top inside require callback
        let currentParcelBoundaryHighlight = null;
        let currentParcelHighlight = null;
        let currentLocationPoint = null;


        // Create simple fill symbol for highlighting parcel boundaries (can adjust color)
        const parcelBoundaryHighlightSymbol = {
            type: "simple-fill",
            color: [0, 0, 0, 0],
            outline: {
                color: [50, 180, 255, 0.9],
                width: 3
            }
        };

        const parcelHighlightSymbol = {
            type: "simple-fill",
            color: [50, 150, 255, 0.15],
            outline: {
                color: [50, 180, 255, 0.9],
                width: 3,
                style: "solid",
            }
        };

        const locationPointSymbol = {
            type: "simple-marker",
            style: "circle",
            color: "rgba(80, 180, 255, 0.8)",
            size: "14px",
            outline: {
                color: "rgba(50, 120, 255, 1)",
                width: 2
            },
        };



        // Utility to clear existing highlights
        function clearHighlights() {
            if (currentParcelBoundaryHighlight) {
                view.graphics.remove(currentParcelBoundaryHighlight);
                currentParcelBoundaryHighlight = null;
            }
            if (currentParcelHighlight) {
                view.graphics.remove(currentParcelHighlight);
                currentParcelHighlight = null;
            }
        }


        // Highlight parcel boundary feature geometry
        function highlightParcelBoundary(feature) {
            clearHighlights();
            currentParcelBoundaryHighlight = new Graphic({
                geometry: feature.geometry,
                symbol: parcelBoundaryHighlightSymbol
            });
            view.graphics.add(currentParcelBoundaryHighlight);
        }

        // Highlight parcel feature geometry
        function highlightParcel(feature) {
            clearHighlights();
            currentParcelHighlight = new Graphic({
                geometry: feature.geometry,
                symbol: parcelHighlightSymbol
            });
            view.graphics.add(currentParcelHighlight);
        }

        function highlightLocationPoint(mapPoint) {
            if (!mapPoint) return;
            currentLocationPoint = new Graphic({
                geometry: mapPoint,
                symbol: locationPointSymbol
            });
            view.graphics.add(currentLocationPoint);
        }



        /* LOCATE MODULE */
        // const locate = new Locate({
        //     view: view,
        // });
        // view.ui.add(locate, "top-left");


        /* SEARCH MODULE */
        const search = new Search({
            view: view,
            includeDefaultSources: false,
            locationEnabled: false,
            viewModel: new SearchViewModel({
                includeDefaultSources: false,
                maxSuggestions: 100,
                minSuggestCharacters: 2
            }),
            sources: [
                {
                    layer: addressLayer,
                    searchFields: [addressLayerAddressAttrName],
                    suggestionTemplate: `{${addressLayerAddressAttrName}}`,
                    outFields: addressLayer.outFields,
                    exactMatch: false,
                    name: "Address",
                    placeholder: "e.g. 123 Main St",
                },
                {
                    layer: parcelLayer,
                    searchFields: [parcelLayerAPNAttrName],
                    suggestionTemplate: `{${parcelLayerAPNAttrName}}`,
                    outFields: parcelLayer.outFields,
                    exactMatch: false,
                    name: "Parcel",
                    placeholder: "e.g. 57605450",
                },
            ]
        });
        view.ui.add(search, "top-right");
        view.ui.add(search, "manual");
        search.container = "search-div";
        search.viewModel._onSearchFocus = function () {
            // Prevent location services from being triggered
            return;
        };

        /* HANDLE MAP CLICK EVENT */
        view.on("click", async function (event) {
            clearHighlights();
            if (currentLocationPoint) {
                view.graphics.remove(currentLocationPoint);
            }

            const mapPoint = event.mapPoint;
            highlightLocationPoint(mapPoint);

            await zoomToLocation(event.mapPoint);


            const attributes = {};
            attributes.latitude = mapPoint.latitude;
            attributes.longitude = mapPoint.longitude;

            const layerAttributes = await queryLayersByLocation(mapPoint);
            Object.assign(attributes, layerAttributes);

            // Query parcel boundaries at click point
            const parcelBoundaryResults = await parcelLayer.queryFeatures({
                geometry: mapPoint,
                spatialRelationship: "intersects",
                outFields: ["*"],
                returnGeometry: true
            });

            if (parcelBoundaryResults.features.length > 0) {
                const parcelBoundaryFeature = parcelBoundaryResults.features[0];
                highlightParcelBoundary(parcelBoundaryFeature);

                // Also check if clicked inside a parcel from parcelLayer and highlight if so
                const parcelResults = await parcelLayer.queryFeatures({
                    geometry: mapPoint,
                    spatialRelationship: "intersects",
                    outFields: ["*"],
                    returnGeometry: true
                });
                if (parcelResults.features.length > 0) {
                    highlightParcel(parcelResults.features[0]);
                }

                await selectAddressByAPN(attributes, parcelBoundaryFeature.geometry, mapPoint);
            } else {
                handleValidSelection(attributes, mapPoint);
            }
        });



        /* HANDLE SEARCH-BAR SELECTION EVENT */
        search.on("select-result", async function (event) {
            clearHighlights();
            if (currentLocationPoint) {
                view.graphics.remove(currentLocationPoint);
            }
            let geometry = event.result.feature.geometry;
            if (geometry.centroid) {
                geometry = geometry.centroid;
            }

            // Query parcel boundaries near the search result geometry
            const parcelBoundaryResults = await parcelLayer.queryFeatures({
                geometry: geometry,
                spatialRelationship: "intersects",
                outFields: ["*"],
                returnGeometry: true
            });

            if (parcelBoundaryResults.features.length > 0) {
                const parcelBoundaryFeature = parcelBoundaryResults.features[0];
                highlightParcelBoundary(parcelBoundaryFeature);
            } else {
                console.log("No parcel boundaries found for this location.");
            }

            await zoomToLocation(geometry);
        });


        async function zoomToLocation(geometry) {
            if (geometry.centroid) {
                geometry = geometry.centroid;
            }
            view.goTo({
                target: geometry,
                zoom: 18,
                duration: 1000,
                easing: "ease-in-out"
            });
        }


        /* GET ADDRESS FROM APN */
        async function getAddressesViaGeometry(geometry) {
            return addressLayer.queryFeatures({
                geometry: geometry,
                spatialRelationship: "intersects",
                outFields: addressLayer.outFields,
                returnGeometry: true,
            });
        }


        async function selectAddressByAPN(attributes, geometry, mapPoint) {
            const addresses = await getAddressesViaGeometry(geometry);
            if (!addresses.features.length) {
                handleValidSelection(attributes, mapPoint);
            } else if (addresses.features.length === 1) {
                Object.assign(attributes, addresses.features[0].attributes);
                handleValidSelection(attributes, mapPoint);
            } else {
                console.log("Multiple Addresses Found at Location");

                const addressGraphics = [];
                const graphicPoint = mapPoint.centroid || mapPoint;

                const sortedAddresses = sortAddresses(addresses.features);

                sortedAddresses.forEach(feature => {
                    const addrAttributes = Object.assign({}, attributes, feature.attributes);
                    const ADDRESS = addrAttributes[addressLayerAddressAttrName];
                    const APN = addrAttributes[parcelLayerAPNAttrName];

                    addressGraphics.push(new Graphic({
                        geometry: graphicPoint,
                        attributes: addrAttributes,
                        popupTemplate: {
                            title: ADDRESS,
                            content: `Multiple addresses found for parcel number ${APN}. Please select the correct address.`,
                            actions: [{
                                title: "Select Address",
                                id: "select-address",
                                className: "esri-icon-check-mark"
                            }]
                        }
                    }));
                });

                view.popup.open({
                    features: addressGraphics,
                    location: graphicPoint
                });
            }
        }

        function sortAddresses(featuresList) {
            // 1) group features by numeric STREET_NO using a plain object
            const byStreet = {};
            for (const feat of featuresList) {
                const sn = Number(feat.attributes.STREET_NO);
                const key = String(sn);
                if (!byStreet[key]) byStreet[key] = [];
                byStreet[key].push(feat);
            }

            // 2) get sorted street numbers
            const sortedStreets = Object.keys(byStreet)
                .map(s => Number(s))
                .sort((a, b) => a - b);

            const output = [];

            // 3) for each street, split into 3 buckets and sort
            for (const sn of sortedStreets) {
                const bucketA = [];        // no BLD_ID & no UNIT_NO
                const bucketB = [];        // UNIT_NO only
                const bucketC = {};        // BLD_ID â†’ [{ feat, unit }]

                for (const feat of byStreet[String(sn)]) {
                    const { BLD_ID, UNIT_NO } = feat.attributes;
                    const b = BLD_ID != null ? parseInt(BLD_ID, 10) : null;
                    const u = UNIT_NO != null ? parseInt(UNIT_NO, 10) : null;
                    const hasB = b != null && !isNaN(b);
                    const hasU = u != null && !isNaN(u);

                    if (!hasB && !hasU) {
                        bucketA.push(feat);
                    } else if (!hasB && hasU) {
                        bucketB.push({ feat, unit: u });
                    } else {
                        const bid = String(b);
                        if (!bucketC[bid]) bucketC[bid] = [];
                        bucketC[bid].push({ feat, unit: u });
                    }
                }

                // 4) concatenate in order:
                //    A) neither â†’ insertion order
                output.push(...bucketA);

                //    B) unit-only â†’ sort by unit
                bucketB.sort((a, b) => a.unit - b.unit);
                output.push(...bucketB.map(x => x.feat));

                //    C) buildings â†’ sort building IDs, then units
                const buildingIds = Object.keys(bucketC)
                    .map(x => Number(x))
                    .sort((a, b) => a - b);
                for (const bid of buildingIds) {
                    const arr = bucketC[String(bid)];
                    arr.sort((a, b) => {
                        const ua = a.unit == null ? Infinity : a.unit;
                        const ub = b.unit == null ? Infinity : b.unit;
                        return ua - ub;
                    });
                    output.push(...arr.map(x => x.feat));
                }
            }

            return output;
        }


        /* HANDLE USER SELECTED ADDRESS FROM APN */
        view.popup.on("trigger-action", async function (event) {
            if (event.action.id === "select-address") {
                // Get the currently selected feature from the popup
                const selectedFeature = view.popup.selectedFeature;
                const attributes = selectedFeature.attributes;
                const geometry = selectedFeature.geometry;
                await handleValidSelection(attributes, geometry);
            }
        });


        /* UTILITY FUNCTIONS */
        async function queryLayersByLocation(geometry) {
            const layers = {
            }

            const newAttributes = {};
            for (const [url, fields] of Object.entries(layers)) {
                try {
                    const layer = new FeatureLayer({
                        url: url,
                        outFields: fields,
                    });
                    const result = await layer.queryFeatures({
                        geometry: geometry,
                        spatialRelationship: "intersects",
                        outFields: fields,
                        returnGeometry: true,
                    });
                    // console.log(result);
                    if (!result.features.length) {
                        console.log(`No features found in layer: ${url}`);
                        continue;
                    }
                    const firstFeature = result.features[0];
                    const layerId = firstFeature.layer.layerId;
                    for (let i in firstFeature.attributes) {
                        newAttributes[`${layerId}_${i}`] = firstFeature.attributes[i];
                    }
                } catch (error) {
                    console.error(`Error querying layer ${url}:`, error);
                    newAttributes[`error_${url}`] = `Error querying layer: ${error.message}`;
                }

            }
            return newAttributes;
        }

        async function getJurisdiction(geometry) {
            let response = "Not Found";
            try {

                const result = await jurisdictionLayer.queryFeatures({
                    geometry: geometry,
                    spatialRelationship: "intersects",
                    outFields: ["*"],
                    returnGeometry: true,
                });
                if (!result.features.length) {
                    console.log("No jurisdiction found for this location.");
                    return "Not Found";
                }
                const firstFeature = result.features[0];
                return firstFeature.attributes["NAME"] || "Not Found";
            } catch (error) {
                console.error("Error querying jurisdiction layer:", error);
                return "Not Found"
            }
            return "Not Found";
        }

        async function handleValidSelection(attributes, geometry) {
            console.log("Valid selection made:", attributes);
            if (attributes["JURIS_OL"]) {
                attributes.jurisdiction = attributes["JURIS_OL"];
            } else {
                attributes.jurisdiction = await getJurisdiction(geometry);
            }
            const popupPoint = geometry.centroid || geometry;
            await zoomToLocation(popupPoint);
            let popupContent = "";
            if (attributes[addressLayerAddressAttrName]) {
                popupContent = `Address: <b>${attributes[addressLayerAddressAttrName]}</b><br>`;
            }
            if (attributes[addressLayerAPNAttrName]) {
                popupContent += `Parcel: <b>${attributes[parcelLayerAPNAttrName]}</b>`;
            }
            if (attributes.jurisdiction) {
                popupContent += `<br>Jurisdiction: <b>${attributes.jurisdiction}</b>`;
            }
            if (attributes.latitude && attributes.longitude) {
                popupContent += `<br>Latitude: <b>${attributes.latitude}</b><br>Longitude: <b>${attributes.longitude}</b>`;
            }
            if (!popupContent) {
                popupContent = "No location information available.";
            }
            view.popup.open({
                title: "Selected Location: ",
                content: popupContent,
                location: popupPoint,
            });
            sendParentMessage("update", attributes);
        }

        function handleInvalidSelection(geometry) {
            view.popup.open({
                title: "Invalid Location",
                content: "Please select a valid location.",
                location: geometry,
            });
            sendParentMessage("clear", null);
        }

        function sendParentMessage(action, data) {
            console.log(`Sending command to wizard: ${action}`);
            const message = {
                from: "map",
                action: action,
                data: data
            }
