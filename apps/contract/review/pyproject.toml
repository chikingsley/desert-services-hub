[project]
name = "contract-review"
version = "0.1.0"
description = "Contract keyword scanner and red-flag detection for Desert Services"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[project.scripts]
contract-review = "contract_review.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_review"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W",
    "UP",
    "B",
    "SIM",
    "C4",
]
ignore = [
    "E501",
    "B008",
    "SIM108",
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["contract_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.11"
root = ["src"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
