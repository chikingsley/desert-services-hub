[project]
name = "talon-extract"
version = "0.1.0"
description = "Email signature extraction and structured contact parsing using Talon heuristics + local LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "regex>=1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[project.scripts]
talon-extract = "talon_extract.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talon_extract"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W",
    "UP",
    "B",
    "SIM",
    "C4",
]
ignore = [
    "E501",
    "B008",
    "SIM108",
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["talon_extract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
