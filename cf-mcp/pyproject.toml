[project]
name = "cf-mcp"
version = "0.1.1"
description = "Cloudflare CLI + MCP server for DNS, tunnels, workers, and token management."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["cloudflare", "cli", "mcp", "dns", "tunnel", "workers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: System :: Networking",
]
dependencies = [
    "httpx>=0.28.0",
    "pydantic-settings>=2.7.0",
    "typer>=0.15.0",
    "fastmcp>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/chikingsley/cf-mcp"
Repository = "https://github.com/chikingsley/cf-mcp"
Issues = "https://github.com/chikingsley/cf-mcp/issues"

[project.scripts]
cf = "cf_mcp.cli:run"
cf-mcp = "cf_mcp.cli:run"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
    "ty>=0.0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cf_mcp"]

[tool.uv]
required-version = ">=0.6.0"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "TC",
    "RUF",
    "N",
    "S",
    "A",
    "C4",
    "PIE",
    "PT",
    "RET",
    "ANN",
    "ASYNC",
    "FURB",
    "PERF",
    "LOG",
    "FA",
]
ignore = [
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S603", "S607", "ANN", "TC"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["cf_mcp"]

[tool.coverage.report]
show_missing = true
skip_empty = true
