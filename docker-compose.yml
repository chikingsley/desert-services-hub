services:
  # ==========================================================================
  # Web App — Frontend SPA + API (estimates, takeoffs, catalog)
  # ==========================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: desert-web
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      MONDAY_FILES_DIR: /app/data/monday-files
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3000/api/health'); if (!r.ok) process.exit(1);"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    command: ["bun", "run", "apps/web/server.ts"]

  # ==========================================================================
  # Webhooks — Monday + Outlook webhook receiver + background worker
  # ==========================================================================
  webhooks:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: desert-webhooks
    ports:
      - "4747:4747"
    env_file: .env
    environment:
      NODE_ENV: production
      WEBHOOK_PORT: 4747
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      MONDAY_FILES_DIR: /app/data/monday-files
      OLLAMA_ENDPOINT: http://host.docker.internal:11434/v1
    volumes:
      - webhooks-data:/app/data
      - /home/simon/.local/share/opencode/auth.json:/root/.local/share/opencode/auth.json:ro
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:4747/api/health'); if (!r.ok) process.exit(1);"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    command: ["bun", "run", "apps/web/webhooks.ts"]

  # ==========================================================================
  # Permit Worker — Browser automation for Maricopa County dust permits
  # ==========================================================================
  permit-worker:
    build:
      context: .
      dockerfile: Dockerfile.permit
    container_name: desert-permit-worker
    ports:
      - "47822:47822" # API server
      - "47821:6080"  # noVNC web interface
    env_file:
      - .env
      - apps/workers/permit-workers/.env
    environment:
      NODE_ENV: production
      HEADLESS: "false"
      VNC_RESOLUTION: 1280x720
      DISPLAY: ":1"
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
    volumes:
      - permit-data:/app/data
    ipc: host
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:47822/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ==========================================================================
  # Cloudflare Tunnel — Exposes services publicly
  # ==========================================================================
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: desert-tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      webhooks:
        condition: service_healthy
      permit-worker:
        condition: service_healthy
    restart: unless-stopped

volumes:
  webhooks-data:
  permit-data:

# =============================================================================
# Usage
# =============================================================================
#
# Start everything:
#   docker compose up -d
#
# Web app:        http://localhost:3000
# Webhooks:       http://localhost:4747 (tunneled to monday-estimates.desertservices.app)
# Permit Worker:  http://localhost:47822 (API + Dashboard)
# Permit VNC:     http://localhost:47821 (watch browser automation)
#
# Logs:           docker compose logs -f web
#                 docker compose logs -f webhooks
#                 docker compose logs -f permit-worker
# Rebuild:        docker compose build && docker compose up -d
# =============================================================================
