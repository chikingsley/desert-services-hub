services:
  # ==========================================================================
  # Web App — Frontend SPA + API (estimates, takeoffs, catalog)
  # ==========================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: desert-web
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      MONDAY_FILES_DIR: /app/data/monday-files
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3000/api/health'); if (!r.ok) process.exit(1);"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    command: ["bun", "run", "apps/web/server.ts"]

  # ==========================================================================
  # Background Jobs — webhook receiver + job queue + sync timers
  # ==========================================================================
  background-jobs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: desert-webhooks
    ports:
      - "4000:4747"
    env_file: .env
    environment:
      NODE_ENV: production
      WEBHOOK_PORT: 4747
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      MONDAY_FILES_DIR: /app/data/monday-files
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-glm-ocr:latest}
      OLLAMA_MANAGER_ENDPOINT: ${OLLAMA_MANAGER_ENDPOINT:-https://mm.peacockery.studio}
      PDF_ANALYSIS_PROVIDER_ORDER: ${PDF_ANALYSIS_PROVIDER_ORDER:-local,mistral,gemini}
      EMAIL_RESOLVER_ENABLED: ${EMAIL_RESOLVER_ENABLED:-1}
      EMAIL_RESOLVER_SPARK_ENABLED: ${EMAIL_RESOLVER_SPARK_ENABLED:-1}
      EMAIL_RESOLVER_SPARK_MODEL: ${EMAIL_RESOLVER_SPARK_MODEL:-openai/gpt-5.3-codex-spark}
      EMAIL_RESOLVER_SPARK_TIMEOUT_MS: ${EMAIL_RESOLVER_SPARK_TIMEOUT_MS:-8000}
      EMAIL_RESOLVER_SPARK_RETRY_TIMEOUT_MS: ${EMAIL_RESOLVER_SPARK_RETRY_TIMEOUT_MS:-12000}
      EMAIL_RESOLVER_SPARK_MAX_CANDIDATES: ${EMAIL_RESOLVER_SPARK_MAX_CANDIDATES:-5}
      EMAIL_RESOLVER_SPARK_CONFIDENCE_MIN: ${EMAIL_RESOLVER_SPARK_CONFIDENCE_MIN:-0.80}
      NOTIFICATIONS_DELIVERY_MODE: ${NOTIFICATIONS_DELIVERY_MODE:-log}
      NOTIFICATIONS_MAILBOX: ${NOTIFICATIONS_MAILBOX:-chi@desertservices.net}
      ATTACHMENT_BACKFILL_MAILBOX_ALLOWLIST: ${ATTACHMENT_BACKFILL_MAILBOX_ALLOWLIST:-contracts@desertservices.net}
      ATTACHMENT_BACKFILL_INCLUDE_NON_PROJECT_ALLOWLIST: ${ATTACHMENT_BACKFILL_INCLUDE_NON_PROJECT_ALLOWLIST:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - webhooks-data:/app/data
      - /home/simon/.local/share/opencode/auth.json:/root/.local/share/opencode/auth.json:ro
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:4747/api/health'); if (!r.ok) process.exit(1);"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    command: ["bun", "run", "apps/background-jobs/webhooks.ts"]

  # ==========================================================================
  # Permit Worker — Browser automation for Maricopa County dust permits
  # ==========================================================================
  permit-worker:
    build:
      context: .
      dockerfile: Dockerfile.permit
    container_name: desert-permit-worker
    ports:
      - "47822:47822" # API server
      - "6080:6080"   # noVNC web interface (maricopa-vnc.desertservices.app)
    env_file: .env
    environment:
      NODE_ENV: production
      HEADLESS: "false"
      VNC_RESOLUTION: 1920x1080
      DISPLAY: ":1"
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - permit-data:/app/data
    ipc: host
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:47822/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  webhooks-data:
  permit-data:

# =============================================================================
# Usage
# =============================================================================
#
# Start everything:
#   docker compose up -d
#
# Web app:        http://localhost:3000
# Background Jobs: http://localhost:4747 (tunneled to webhooks.desertservices.app)
# Permit Worker:  http://localhost:47822 (API + Dashboard)
# Permit VNC:     http://localhost:6080 (watch browser automation / maricopa-vnc.desertservices.app)
#
# Logs:           docker compose logs -f web
#                 docker compose logs -f background-jobs
#                 docker compose logs -f permit-worker
# Rebuild:        docker compose build && docker compose up -d
# =============================================================================
