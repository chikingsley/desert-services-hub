services:
  # ==========================================================================
  # Web App — Frontend SPA + API (estimates, takeoffs, catalog)
  # ==========================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: desert-web
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres.pooler-dev:postgres@host.docker.internal:54329/postgres
      MONDAY_FILES_DIR: /app/data/monday-files
      BC_WORKER_BASE_URL: ${BC_WORKER_BASE_URL:-http://bc-worker:47824}
      BUILDINGCONNECTED_AUTH_VNC_PORT: ${BUILDINGCONNECTED_AUTH_VNC_PORT:-6081}
      BUILDINGCONNECTED_AUTH_VNC_URL: ${BUILDINGCONNECTED_AUTH_VNC_URL:-https://buildingconnected-vnc.desertservices.app/vnc.html?autoconnect=true&resize=scale&reconnect=true&reconnect_delay=2000&view_only=false&shared=true}
      PERMIT_WORKER_URL: http://permit-worker:47822
      PERMIT_WORKER_VNC_WS_URL: ${PERMIT_WORKER_VNC_WS_URL:-wss://maricopa-vnc.desertservices.app}
      BUILDINGCONNECTED_AUTH_VNC_WS_URL: ${BUILDINGCONNECTED_AUTH_VNC_WS_URL:-wss://buildingconnected-vnc.desertservices.app}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3000/api/health'); if (!r.ok) process.exit(1);"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    command: ["bun", "run", "apps/web/server.ts"]

  # ==========================================================================
  # Webhook Gateway — Public Cloudflare origin for Supabase webhook endpoints
  # ==========================================================================
  webhook-gateway:
    image: nginx:1.27-alpine
    container_name: desert-webhook-gateway
    ports:
      - "4000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ops/webhook-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ==========================================================================
  # PDF Analysis — FastAPI service for PDF extraction, classification, OCR
  # ==========================================================================
  pdf-analysis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: desert-pdf-analysis
    ports:
      - "4848:4848"
    env_file: .env
    environment:
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3-flash-preview}
      PDF_ANALYSIS_PROVIDER_ORDER: ${PDF_ANALYSIS_PROVIDER_ORDER:-local,gemini}
      OLLAMA_ENDPOINT: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: glm-ocr:latest
      OLLAMA_CHAT_MODEL: granite4:latest
      OLLAMA_MANAGER_ENDPOINT: ${OLLAMA_MANAGER_ENDPOINT:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - webhooks-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4848/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    command: ["uv", "run", "--project", "packages/documents/intake", "uvicorn", "pdf_analysis.server:app", "--host", "0.0.0.0", "--port", "4848"]

  # ==========================================================================
  # Permit Worker — Browser automation for Maricopa County dust permits
  # ==========================================================================
  permit-worker:
    build:
      context: .
      dockerfile: apps/dust-permits/Dockerfile
    container_name: desert-permit-worker
    init: true  # Prevent zombie Chromium renderer processes (PID 1 reaping)
    ports:
      - "47822:47822" # API server
      - "6080:6080"   # noVNC web interface (maricopa-vnc.desertservices.app)
    env_file: .env
    environment:
      NODE_ENV: production
      HEADLESS: "false"
      DOCKER_CONTAINER: "true"
      VNC_RESOLUTION: 1920x1080
      DISPLAY: ":1"
      DATABASE_URL: postgresql://postgres.pooler-dev:postgres@host.docker.internal:54329/postgres
      WEB_APP_URL: http://web:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - permit-data:/app/data
    ipc: host
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:47822/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ==========================================================================
  # AQData Worker — HTTP sync + continuous AQ data scrape snapshots
  # ==========================================================================
  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: desert-crawl4ai
    shm_size: "1gb"
    ports:
      - "11235:11235"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:11235/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  aqdata-worker:
    build:
      context: .
      dockerfile: apps/aqdata-worker/Dockerfile
    container_name: desert-aqdata-worker
    ports:
      - "47823:47823"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 47823
      DATABASE_URL: postgresql://postgres.pooler-dev:postgres@host.docker.internal:54329/postgres
      AQDATA_HTTP_IDLE_TIMEOUT_S: ${AQDATA_HTTP_IDLE_TIMEOUT_S:-255}
      AQDATA_OUTPUT_DIR: /app/data/aqdata
      AQDATA_SCRAPE_INTERVAL_MS: ${AQDATA_SCRAPE_INTERVAL_MS:-900000}
      AQDATA_DETAIL_SCRAPE_BATCH_SIZE: ${AQDATA_DETAIL_SCRAPE_BATCH_SIZE:-10}
      AQDATA_DETAIL_FETCH_BACKEND: ${AQDATA_DETAIL_FETCH_BACKEND:-client}
      AQDATA_CRAWL4AI_BASE_URL: ${AQDATA_CRAWL4AI_BASE_URL:-http://crawl4ai:11235}
      AQDATA_CRAWL4AI_TIMEOUT_MS: ${AQDATA_CRAWL4AI_TIMEOUT_MS:-120000}
      AQDATA_CRAWL4AI_BEARER_TOKEN: ${AQDATA_CRAWL4AI_BEARER_TOKEN:-}
      AQDATA_COMPANY_NAME: ${AQDATA_COMPANY_NAME:-Desert Services}
      AQDATA_COORDINATES_API_URL: ${AQDATA_COORDINATES_API_URL:-}
      AQDATA_IGNORE_PERMIT_IDS: ${AQDATA_IGNORE_PERMIT_IDS:-D0065255}
    depends_on:
      crawl4ai:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - aqdata-data:/app/data/aqdata
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:47823/health'); if (!r.ok) process.exit(1);"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ==========================================================================
  # BC Worker — BuildingConnected auth browser automation (headed Playwright)
  # ==========================================================================
  bc-worker:
    build:
      context: .
      dockerfile: apps/bc-worker/Dockerfile
    container_name: desert-bc-worker
    init: true
    ports:
      - "47824:47824" # API server
      - "6081:6080"   # noVNC web interface (buildingconnected-vnc.desertservices.app)
    env_file: .env
    environment:
      NODE_ENV: production
      DOCKER_CONTAINER: "true"
      VNC_RESOLUTION: ${BC_WORKER_VNC_RESOLUTION:-1920x1080}
      DISPLAY: ":1"
      EMAIL_BODY_LINK_PLAYWRIGHT_HEADLESS: "0"
      EMAIL_BODY_LINK_PLAYWRIGHT_STORAGE_STATE_PATH: /app/data/attachments/body-links-auth/state.json
      EMAIL_BODY_LINK_PLAYWRIGHT_DEBUG_DIR: /app/data/attachments/body-links-debug
      BUILDINGCONNECTED_AUTH_MANUAL_TIMEOUT_MS: ${BUILDINGCONNECTED_AUTH_MANUAL_TIMEOUT_MS:-1200000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - webhooks-data:/app/data
    ipc: host
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:47824/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ==========================================================================
  # Trigger.dev Self-Host — Orchestration UI + Worker Runtime (Profile: trigger)
  # ==========================================================================
  webapp:
    profiles: ["trigger"]
    image: ghcr.io/triggerdotdev/trigger.dev:v4-beta
    restart: unless-stopped
    ports:
      - "0.0.0.0:8030:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    volumes:
      - trigger-shared:/home/node/shared
    user: root
    command: >-
      sh -c "chown -R node:node /home/node/shared &&
      if [ \"$$SKIP_CLICKHOUSE_MIGRATIONS\" != '1' ] && [ -n \"$$CLICKHOUSE_URL\" ]; then
        export GOOSE_DRIVER=clickhouse &&
        export GOOSE_DBSTRING=\"$${CLICKHOUSE_URL}?secure=false\" &&
        export GOOSE_MIGRATION_DIR=/triggerdotdev/internal-packages/clickhouse/schema &&
        /usr/local/bin/goose up &&
        echo 'ClickHouse migrations complete.' ;
      fi &&
      export SKIP_CLICKHOUSE_MIGRATIONS=1 &&
      exec ./scripts/entrypoint.sh"
    env_file:
      - ./apps/trigger-dev/hosting/docker/.env
    environment:
      ELECTRIC_ORIGIN: http://electric:3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS_DISABLED: "true"
      APP_LOG_LEVEL: info
      DEPLOY_REGISTRY_HOST: 172.17.0.1:5000
      DEPLOY_REGISTRY_NAMESPACE: trigger
      GRACEFUL_SHUTDOWN_TIMEOUT: 1000
      TRIGGER_BOOTSTRAP_ENABLED: "1"
      TRIGGER_BOOTSTRAP_WORKER_GROUP_NAME: bootstrap
      TRIGGER_BOOTSTRAP_WORKER_TOKEN_PATH: /home/node/shared/worker_token
      RUN_REPLICATION_ENABLED: "1"
      CLICKHOUSE_LOG_LEVEL: info
      RUN_REPLICATION_LOG_LEVEL: info
      INTERNAL_OTEL_TRACE_LOGGING_ENABLED: "0"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "http.get('http://localhost:3000/healthcheck', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  postgres:
    profiles: ["trigger"]
    image: postgres:14
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - trigger-postgres:/var/lib/postgresql/data/
    command:
      - -c
      - wal_level=logical
    env_file:
      - ./apps/trigger-dev/hosting/docker/.env
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    profiles: ["trigger"]
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:6389:6379"
    volumes:
      - trigger-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  electric:
    profiles: ["trigger"]
    image: electricsql/electric:1.2.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./apps/trigger-dev/hosting/docker/.env
    environment:
      ELECTRIC_INSECURE: "true"
      ELECTRIC_USAGE_REPORTING: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  clickhouse:
    profiles: ["trigger"]
    image: bitnamilegacy/clickhouse:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9123:8123"
      - "127.0.0.1:9090:9000"
    volumes:
      - trigger-clickhouse:/bitnami/clickhouse
      - ./apps/trigger-dev/hosting/docker/clickhouse/override.xml:/bitnami/clickhouse/etc/config.d/override.xml:ro
    env_file:
      - ./apps/trigger-dev/hosting/docker/.env
    environment:
      CLICKHOUSE_ADMIN_USER: default
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --host localhost --port 9000 --user default --password \"$$CLICKHOUSE_ADMIN_PASSWORD\" --query \"SELECT 1\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  registry:
    profiles: ["trigger"]
    image: registry:2
    restart: unless-stopped
    ports:
      - "0.0.0.0:5000:5000"
    volumes:
      - ./apps/trigger-dev/hosting/docker/registry/auth.htpasswd:/auth/htpasswd:ro
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry Realm
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    profiles: ["trigger"]
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - trigger-minio:/bitnami/minio/data
    env_file:
      - ./apps/trigger-dev/hosting/docker/.env
    environment:
      MINIO_DEFAULT_BUCKETS: packets
      MINIO_BROWSER: "on"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  supervisor:
    profiles: ["trigger"]
    image: ghcr.io/triggerdotdev/supervisor:v4-beta
    restart: unless-stopped
    depends_on:
      docker-proxy:
        condition: service_healthy
    volumes:
      - trigger-shared:/home/node/shared
    deploy:
      replicas: 4
    user: root
    command: sh -c "chown -R node:node /home/node/shared && exec /usr/bin/dumb-init -- pnpm run --filter supervisor start"
    env_file:
      - ./apps/trigger-dev/hosting/docker/.env
    environment:
      TRIGGER_WORKER_TOKEN: file:///home/node/shared/worker_token
      TRIGGER_API_URL: http://webapp:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://webapp:3000/otel
      TRIGGER_WORKLOAD_API_DOMAIN: supervisor
      TRIGGER_WORKLOAD_API_PORT_EXTERNAL: 8020
      DEBUG: "1"
      ENFORCE_MACHINE_PRESETS: "1"
      TRIGGER_DEQUEUE_INTERVAL_MS: 1000
      DOCKER_HOST: tcp://docker-proxy:2375
      DOCKER_RUNNER_NETWORKS: desert-services-hub_default
      DOCKER_AUTOREMOVE_EXITED_CONTAINERS: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "http.get('http://localhost:8020/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  docker-proxy:
    profiles: ["trigger"]
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LOG_LEVEL: info
      POST: "1"
      CONTAINERS: "1"
      IMAGES: "1"
      INFO: "1"
      NETWORKS: "1"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "2375"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  webhooks-data:
  permit-data:
  aqdata-data:
  trigger-shared:
    name: trigger_shared
    external: true
  trigger-postgres:
    name: trigger_postgres
    external: true
  trigger-redis:
    name: trigger_redis
    external: true
  trigger-clickhouse:
    name: trigger_clickhouse
    external: true
  trigger-minio:
    name: trigger_minio
    external: true

# =============================================================================
# Usage
# =============================================================================
#
# Start everything:
#   docker compose up -d
#
# Web app:        http://localhost:3000
# BC Worker API:  http://localhost:47824
# BC Auth VNC:    http://localhost:6081 (buildingconnected-vnc.desertservices.app)
# Permit Worker:  http://localhost:47822 (API + Dashboard)
# Permit VNC:     http://localhost:6080 (watch browser automation / maricopa-vnc.desertservices.app)
#
# Logs:           docker compose logs -f web
#                 docker compose logs -f permit-worker
# Trigger up:     docker compose --profile trigger up -d
# Trigger logs:   docker compose logs -f webapp supervisor
# Rebuild:        docker compose build && docker compose up -d
# =============================================================================
