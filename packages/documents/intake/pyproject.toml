[project]
name = "pdf-analysis"
version = "0.1.0"
description = "Unified PDF analysis CLI with Gemini, local OCR, and Mistral providers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "httpx>=0.28.0",
    "kreuzberg",
    "onnxruntime>=1.20.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "rapidocr>=3.6.0",
    "typer>=0.12.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[project.scripts]
pdf-analysis = "pdf_analysis.cli:main"
plan-ocr = "pdf_analysis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_analysis"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W",
    "UP",
    "B",
    "SIM",
    "C4",
]
ignore = [
    "E501",
    "B008",
    "SIM108",
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["pdf_analysis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["pdf_analysis.estimates"]
disable_error_code = ["prop-decorator"]

[tool.ty.environment]
python-version = "3.11"
root = ["src"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.uv.sources]
kreuzberg = { path = "vendor/kreuzberg-4.3.3-cp310-abi3-linux_x86_64.whl" }
