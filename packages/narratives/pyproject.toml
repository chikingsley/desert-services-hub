[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swppp"]

[project]
name = "swppp"
version = "0.1.0"
description = "SWPPP document generation from NOI + estimate data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docxtpl>=0.20.2",
    "fastapi>=0.121.3",
    "google-generativeai>=0.7.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "ruff>=0.14.5",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = ["pytest>=9.0.1"]

[tool.ruff]
target-version = "py312"
line-length = 100
