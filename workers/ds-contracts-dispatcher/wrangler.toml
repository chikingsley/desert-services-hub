name = "contracts-dispatcher"
main = "src/index.ts"
compatibility_date = "2026-01-27"
compatibility_flags = ["nodejs_compat_v2"]

# Send email binding for notifications
send_email = [
  { name = "SEND_EMAIL", destination_address = "chi@desertservices.net" }
]

# Observability
[observability]
enabled = true

# Email routing address: contracts-dispatch@desertservices.app (or wherever you route it)
# Workers.dev URL: contracts-dispatcher.cheez2012.workers.dev

# Secrets (set via dashboard or `wrangler secret put`):
# - AZURE_TENANT_ID
# - AZURE_CLIENT_ID
# - AZURE_CLIENT_SECRET
