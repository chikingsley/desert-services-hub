name = "monday-status-sync"
main = "src/index.ts"
compatibility_date = "2026-01-21"
compatibility_flags = ["nodejs_compat_v2"]

# Cron trigger - runs every hour at :15
[triggers]
crons = ["15 * * * *"]

# Observability
[observability]
enabled = true

# Secrets (set via dashboard or `wrangler secret put`):
# - MONDAY_API_KEY
